<main class="off-topic-page">
  <span class="off-topic-backdrop" aria-hidden="true"></span>

  <app-page-masthead page="off-topic"></app-page-masthead>

  <section class="off-topic-content" aria-label="Off-topic notes">
    <p>A place for side notes, experiments, and everything that does not fit neatly elsewhere.</p>

    <div class="soundcloud-embed">
      <iframe
        title="Midas Peak SoundCloud playlist"
        width="100%"
        height="450"
        scrolling="no"
        loading="lazy"
        allow="autoplay; encrypted-media"
        src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/soundcloud%253Aplaylists%253A2307101184&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true"
      ></iframe>
      <p class="soundcloud-attribution">
        <a href="https://soundcloud.com/midaspeak" title="Midas Peak." target="_blank" rel="noopener noreferrer"
          >Midas Peak.</a
        >
        ·
        <a
          href="https://soundcloud.com/midaspeak/sets/midas-peak"
          title="Midas Peak."
          target="_blank"
          rel="noopener noreferrer"
          >Midas Peak.</a
        >
      </p>
    </div>
  </section>

  <footer class="off-topic-footer">
    <app-orbit-mark></app-orbit-mark>
    <app-portfolio-index current="off-topic" [showContact]="true"></app-portfolio-index>
  </footer>
</main>
