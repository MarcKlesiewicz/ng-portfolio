<section
  class="testimonial"
  aria-label="Kind words"
  [style.--testimonial-duration]="rotationDuration"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
  (focusin)="onFocusIn()"
  (focusout)="onFocusOut($event)"
>
  <app-wavy-header title="Kind words"></app-wavy-header>

  <div class="testimonial-stage" aria-live="polite">
    @for (testimonial of testimonials; track testimonial.author; let index = $index) {
      <blockquote
        [class.is-active]="index === currentIndex()"
        [attr.aria-hidden]="index === currentIndex() ? null : 'true'"
      >
        <p>{{ testimonial.quote }}</p>
        <footer>
          <cite>{{ testimonial.author }}</cite>
          <span>{{ testimonial.source }}</span>
        </footer>
      </blockquote>
    }
  </div>

  <nav class="testimonial-pagination" aria-label="Choose a testimonial">
    <div class="testimonial-dots">
      @for (testimonial of testimonials; track testimonial.author; let index = $index) {
        <button
          type="button"
          [class.is-active]="index === currentIndex()"
          [attr.aria-current]="index === currentIndex() ? 'true' : null"
          [attr.aria-label]="'Show testimonial ' + (index + 1) + ' of ' + testimonials.length"
          (click)="selectTestimonial(index)"
        ></button>
      }
    </div>
  </nav>
</section>
