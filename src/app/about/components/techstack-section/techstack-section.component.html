<section class="techstack-section" aria-label="How I work">
  <app-wavy-header title="Tools I currently reach for"></app-wavy-header>

  <p class="section-deck">Tools change. The practices behind good product work stay.</p>

  <div class="workbench">
    <article *ngFor="let group of toolGroups" class="workbench-group">
      <header>
        <span aria-hidden="true">{{ group.marker }}</span>
        <h3>{{ group.title }}</h3>
      </header>
      <p>{{ group.description }}</p>
      <ul>
        <li *ngFor="let tool of group.tools">{{ tool }}</li>
      </ul>
    </article>
  </div>
</section>
