<header class="site-header">
  <a routerLink="/" class="brand" aria-label="Marc Klesiewicz — home">MK</a>
  <button
    #menuTrigger
    type="button"
    class="menu-trigger"
    aria-controls="site-menu"
    [attr.aria-expanded]="isMenuOpen()"
    (click)="toggleMenu()"
  >
    <span class="menu-trigger__label">Menu</span>
    <span aria-hidden="true" class="material-icons-outlined">{{ isMenuOpen() ? 'close' : 'drag_handle' }}</span>
  </button>
</header>

<dialog #menuDialog id="site-menu" class="menu-dialog" aria-labelledby="menu-title" (cancel)="onDialogCancel($event)">
  <div class="menu-dialog__topline">
    <p id="menu-title" class="editorial-kicker">Where to?</p>
    <button type="button" class="menu-close" aria-label="Close menu" (click)="closeMenu()">
      <span aria-hidden="true" class="material-icons-outlined">close</span>
    </button>
  </div>
  <nav aria-label="Primary navigation" class="menu-links">
    <a
      routerLink="/"
      routerLinkActive="is-current"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu(false)"
    >
      <span>01</span>Home
    </a>
    <a routerLink="/projects" routerLinkActive="is-current" (click)="closeMenu(false)"><span>02</span>Projects</a>
    <a routerLink="/about" routerLinkActive="is-current" (click)="closeMenu(false)"><span>03</span>About Marc</a>
  </nav>
  <p class="menu-note">Frontend craft, app development, and a few thoughtful detours.</p>
</dialog>
