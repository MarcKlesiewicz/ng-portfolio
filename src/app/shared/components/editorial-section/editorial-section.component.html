<section class="editorial-section" [class.editorial-section--paper]="tone === 'paper'">
  @if (eyebrow) {
  <p class="editorial-kicker">{{ eyebrow }}</p>
  } @if (title) {
  <h2 class="editorial-title">{{ title }}</h2>
  }
  <div class="editorial-section__content">
    <ng-content></ng-content>
  </div>
</section>
