<div class="page-shell page-shell-primary">
  <div class="content-column content-column-md gap-6 mt-8">
    <app-project-filter></app-project-filter>
    @for (project of projects$ | async; track project.id) {
    <app-project-card [project]="project"></app-project-card>
    } @empty {
    <h1>Sorry, no projects matched your filters</h1>
    }
  </div>
</div>
