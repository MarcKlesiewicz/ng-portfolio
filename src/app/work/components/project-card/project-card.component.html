<article class="project-card">
  <a
    [routerLink]="['/projects', project.slug]"
    queryParamsHandling="preserve"
    [attr.aria-label]="'Read the ' + project.name + ' project story'"
  >
    <figure>
      <img
        [src]="project.thumbnail.src"
        [alt]="project.thumbnail.alt"
        [width]="project.thumbnail.width"
        [height]="project.thumbnail.height"
        loading="lazy"
      />
      <figcaption>{{ project.projectType }} · {{ project.year }}</figcaption>
    </figure>
    <div class="project-card__copy">
      <h2>{{ project.name }}</h2>
      <p>{{ project.description }}</p>
      <ul aria-label="Technologies">
        @for (technology of project.technologies; track technology) {
        <li>{{ technologyLabel(technology) }}</li>
        }
      </ul>
      <span class="project-card__action">Read the story <span aria-hidden="true">↗</span></span>
    </div>
  </a>
</article>
