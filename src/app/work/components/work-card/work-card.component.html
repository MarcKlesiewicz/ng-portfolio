@if (work(); as item) {
  <a class="work-card" [class.work-card--reverse]="reverse()" [routerLink]="['/work', item.slug]">
    <figure class="work-visual">
      <img class="work-thumbnail" [src]="item.thumbnail.src" [alt]="item.thumbnail.alt" loading="lazy" />
    </figure>

    <div class="work-copy">
      <div class="work-meta">
        <time [attr.datetime]="item.year">{{ item.year }}</time>
        <span>{{ item.category }}</span>
      </div>

      <div class="work-heading">
        @if (item.logo) {
          <span class="work-logo" aria-hidden="true">
            <img [src]="item.logo.src" alt="" loading="lazy" />
          </span>
        }
        <h2 class="card-title">{{ item.name }}</h2>
      </div>

      <p class="work-description">{{ item.description }}</p>

      <ul class="technology-list" aria-label="Technologies">
        @for (technology of item.technologies; track technology) {
          <li><fa-icon [icon]="faDiamond" aria-hidden="true"></fa-icon>{{ technology }}</li>
        }
      </ul>

      <span class="work-link">
        View case study
        <fa-icon [icon]="faArrowRight" aria-hidden="true"></fa-icon>
      </span>
    </div>
  </a>
}
